<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lottie Preview</title>
  <script src="https://unpkg.com/lottie-web/build/player/lottie.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 16px; }
    #stage { width: 320px; height: 320px; border: 1px solid #ddd; border-radius: 12px; }
    .row { display:flex; gap: 12px; align-items:center; margin-bottom: 12px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="row">
    <input id="file" type="file" accept=".json,application/json" />
    <button id="play">play</button>
    <button id="stop">stop</button>
  </div>
  <div id="stage"></div>

  <script>
    const stage = document.getElementById('stage');
    const fileInput = document.getElementById('file');
    let anim = null;
    let lastData = null;

    function loadAnimation(data){
      stage.innerHTML = '';
      if (anim) anim.destroy();

      anim = lottie.loadAnimation({
        container: stage,
        renderer: 'svg',
        loop: true,
        autoplay: true,
        animationData: data
      });
    }

    fileInput.addEventListener('change', async (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      const text = await f.text();
      lastData = JSON.parse(text);
      loadAnimation(lastData);
    });

    document.getElementById('play').onclick = () => anim?.play();
    document.getElementById('stop').onclick = () => anim?.stop();
  </script>
</body>
</html>
