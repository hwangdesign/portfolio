<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script async src="../assets/analytics.js"></script>
    <meta name="description" content="Art — 코딩으로 만든 그래픽 · 온라인 전시관">
    <meta name="theme-color" content="#000000" id="themeColorMeta">
    <title>Art | 온라인 전시관</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <style>
        .art-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-top: 32px; }
        .art-card { display: block; text-decoration: none; color: inherit; border: 1px solid var(--border-white-20); transition: var(--transition); }
        .art-card:hover { border-color: var(--yellow-color); }
        .art-card__thumb { aspect-ratio: 4/3; background: var(--bg-color); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .art-card__thumb img { width: 100%; height: 100%; object-fit: cover; }
        .art-card__info { padding: 16px; }
        .art-card__title { font-size: var(--font-size-subtitle); font-weight: 700; margin-bottom: 4px; }
        .art-card__meta { font-size: var(--font-size-small); color: var(--text-light); }
        .art-empty { padding: 48px 0; text-align: center; color: var(--text-light); }
    </style>
</head>
<body>
    <div id="shared-nav"></div>
    <main class="main-content">
        <div class="divider"></div>
        <section class="section">
            <div class="container">
                <h1 class="section-title animated-section-title" id="animatedTitle" data-title="Art">Art</h1>
                <p class="hero-info-description" style="margin-top: 16px;">코딩으로 만든 그래픽 작업 · 데이터 기반 온라인 전시관</p>
                <div id="art-gallery" class="art-gallery"></div>
                <div id="art-empty" class="art-empty" style="display: none;">등록된 작품이 없습니다. art/data/exhibition.json에 작품을 추가하세요.</div>
            </div>
        </section>
    </main>
    <div id="shared-footer"></div>
    <script src="../assets/script.js"></script>
    <script>
        (function () {
            var base = document.querySelector('base') && document.querySelector('base').href
                ? document.querySelector('base').href
                : (window.location.pathname.replace(/\/[^/]*$/, '/') || '/');
            if (!base.endsWith('/')) base += '/';
            var dataUrl = 'data/exhibition.json';
            var gallery = document.getElementById('art-gallery');
            var empty = document.getElementById('art-empty');

            fetch(dataUrl)
                .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('데이터를 불러올 수 없습니다.')); })
                .then(function (data) {
                    var works = Array.isArray(data.works) ? data.works : [];
                    if (works.length === 0) {
                        empty.style.display = 'block';
                        return;
                    }
                    works.forEach(function (work) {
                        var card = document.createElement('a');
                        card.className = 'art-card';
                        card.href = work.detailUrl || '#';
                        if (work.detailUrl) card.setAttribute('target', '_blank');
                        var thumbUrl = work.thumbnail
                            ? (work.thumbnail.indexOf('http') === 0 ? work.thumbnail : base + work.thumbnail)
                            : '';
                        var thumbWrap = document.createElement('div');
                        thumbWrap.className = 'art-card__thumb';
                        if (thumbUrl) {
                            var img = document.createElement('img');
                            img.src = thumbUrl;
                            img.alt = work.title || '';
                            img.loading = 'lazy';
                            img.addEventListener('error', function () {
                                thumbWrap.innerHTML = '<span style="color:var(--text-light)">No image</span>';
                            });
                            thumbWrap.appendChild(img);
                        } else {
                            thumbWrap.innerHTML = '<span style="color:var(--text-light)">No image</span>';
                        }
                        var info = document.createElement('div');
                        info.className = 'art-card__info';
                        var titleEl = document.createElement('div');
                        titleEl.className = 'art-card__title';
                        titleEl.textContent = work.title || 'Untitled';
                        info.appendChild(titleEl);
                        var meta = document.createElement('div');
                        meta.className = 'art-card__meta';
                        meta.textContent = [work.year, work.technique].filter(Boolean).join(' · ');
                        info.appendChild(meta);
                        if (work.description) {
                            var desc = document.createElement('p');
                            desc.style.marginTop = '8px';
                            desc.style.fontSize = 'var(--font-size-small)';
                            desc.style.color = 'var(--text-light)';
                            desc.textContent = work.description;
                            info.appendChild(desc);
                        }
                        card.appendChild(thumbWrap);
                        card.appendChild(info);
                        gallery.appendChild(card);
                    });
                })
                .catch(function (err) {
                    empty.textContent = '전시 데이터를 불러오지 못했습니다. ' + err.message;
                    empty.style.display = 'block';
                });
        })();
    </script>
</body>
</html>
