# 4시간마다 네이버 쇼핑 검색 API로 인기 키워드 순위 수집 → trends-data 브랜치 푸시
name: Naver Shopping Keywords 4h

permissions:
  contents: write

on:
  schedule:
    - cron: '0 */4 * * *'  # 매 4시간 정각 (UTC)
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/TrendingSearches

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Naver Shopping API (순위 키워드 매칭)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node naver-shopping-api.js
        continue-on-error: true

      - name: Push to trends-data branch
        working-directory: ${{ github.workspace }}
        run: |
          [ -f labs/TrendingSearches/naver/naver_shopping_sample.json ] || exit 0
          cp labs/TrendingSearches/naver/naver_shopping_sample.json /tmp/
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git fetch origin trends-data 2>/dev/null || true
          if git rev-parse --verify origin/trends-data >/dev/null 2>&1; then
            git checkout -B trends-data origin/trends-data
          else
            git checkout -b trends-data
          fi
          mkdir -p labs/TrendingSearches/naver
          cp /tmp/naver_shopping_sample.json labs/TrendingSearches/naver/
          git add labs/TrendingSearches/naver/naver_shopping_sample.json
          git diff --staged --quiet && echo "No changes" || {
            git commit -m "chore: Naver 쇼핑 인기 키워드 4h $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin trends-data 2>/dev/null || true
            git push -u origin trends-data
          }
