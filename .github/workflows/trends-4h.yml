# 4시간마다 네이버 쇼핑 검색 API로 인기 키워드 순위 수집 → trends-data 브랜치 푸시
name: Naver Shopping Keywords 4h

permissions:
  contents: write

on:
  schedule:
    - cron: '0 23,3,7,11 * * *'  # KST 08:00, 12:00, 16:00, 20:00 (매일 8시~밤 10시 구간, 4시간마다)
  workflow_dispatch: {}    # Actions 탭 → 왼쪽에서 워크플로 선택 → 오른쪽 "Run workflow"
  push:
    branches: [main]
    paths:
      - '.github/workflows/trends-4h.yml'
      - 'labs/TrendingSearches/naver-shopping-api.js'

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/TrendingSearches

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Naver Shopping API (순위 키워드 매칭)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node naver-shopping-api.js
        continue-on-error: true

      - name: Push to trends-data branch
        working-directory: ${{ github.workspace }}
        run: |
          [ -f labs/TrendingSearches/naver/naver_shopping_sample.json ] || exit 0
          cp labs/TrendingSearches/naver/naver_shopping_sample.json /tmp/
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git restore labs/TrendingSearches/naver/ 2>/dev/null || git checkout -- labs/TrendingSearches/naver/ 2>/dev/null || true
          git clean -fd labs/TrendingSearches/naver/ 2>/dev/null || true
          git fetch origin trends-data 2>/dev/null || true
          if git rev-parse --verify origin/trends-data >/dev/null 2>&1; then
            git checkout -B trends-data origin/trends-data
          else
            git checkout -b trends-data
          fi
          mkdir -p labs/TrendingSearches/naver
          cp /tmp/naver_shopping_sample.json labs/TrendingSearches/naver/
          git add labs/TrendingSearches/naver/naver_shopping_sample.json
          git diff --staged --quiet && echo "No changes" || {
            git commit -m "chore: Naver 쇼핑 인기 키워드 4h $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin trends-data 2>/dev/null || true
            git push -u origin trends-data
          }

      - name: Output top 10 keywords
        working-directory: ${{ github.workspace }}
        run: |
          echo "## Top 10 Keywords" >> $GITHUB_STEP_SUMMARY
          if [ -f labs/TrendingSearches/naver/naver_shopping_sample.json ]; then
            jq -r '.items[]? | "\(.ranking). \(.keyword)"' labs/TrendingSearches/naver/naver_shopping_sample.json 2>/dev/null | head -10 | while read -r line; do
              echo "$line" >> $GITHUB_STEP_SUMMARY
              echo "$line"
            done
          else
            echo "No data" >> $GITHUB_STEP_SUMMARY
          fi
