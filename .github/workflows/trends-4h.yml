# 네이버 개발자 센터 API 연동 — 리얼 트렌드 데이터로 인기 키워드 매일 갱신
# Naver Developer Center 발급 Client ID/Secret → 데이터랩 쇼핑인사이트 API 호출 → 상위 10개 키워드를 trends-data 브랜치에 푸시
name: Naver API 인기 키워드 매일 갱신

permissions:
  contents: write

on:
  schedule:
    - cron: '0 3 * * *'  # 매일 1회: KST 12:00 (UTC 03:00)
  workflow_dispatch: {}  # 수동 실행: Actions 탭에서 Run workflow
  push:
    branches: [main]
    paths:
      - '.github/workflows/trends-4h.yml'
      - 'legacy/labs/TrendingSearches/naver-shopping-api.js'

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/labs/TrendingSearches

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 네이버 API 연동 — 리얼 데이터 인기 키워드 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          if [ -z "$NAVER_CLIENT_ID" ] || [ -z "$NAVER_CLIENT_SECRET" ]; then
            echo "::warning::네이버 개발자 센터 API 연동을 위해 Repository Secrets에 NAVER_CLIENT_ID, NAVER_CLIENT_SECRET을 설정하세요."
            echo "설정 방법: README > API 연동 설정 참고"
            exit 0
          fi
          node naver-shopping-api.js
        continue-on-error: true

      - name: Push to trends-data branch
        working-directory: ${{ github.workspace }}
        run: |
          [ -f legacy/labs/TrendingSearches/naver/naver_shopping_sample.json ] || exit 0
          cp legacy/labs/TrendingSearches/naver/naver_shopping_sample.json /tmp/
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git restore legacy/labs/TrendingSearches/naver/ 2>/dev/null || git checkout -- legacy/labs/TrendingSearches/naver/ 2>/dev/null || true
          git clean -fd legacy/labs/TrendingSearches/naver/ 2>/dev/null || true
          git fetch origin trends-data 2>/dev/null || true
          if git rev-parse --verify origin/trends-data >/dev/null 2>&1; then
            git checkout -B trends-data origin/trends-data
          else
            git checkout -b trends-data
          fi
          mkdir -p legacy/labs/TrendingSearches/naver
          cp /tmp/naver_shopping_sample.json legacy/labs/TrendingSearches/naver/
          git add legacy/labs/TrendingSearches/naver/naver_shopping_sample.json
          git diff --staged --quiet && echo "No changes" || {
            git commit -m "chore: 네이버 API 인기 키워드 갱신 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin trends-data 2>/dev/null || true
            git push -u origin trends-data
          }

      - name: Output top 10 keywords
        working-directory: ${{ github.workspace }}
        run: |
          echo "## Top 10 Keywords" >> $GITHUB_STEP_SUMMARY
          if [ -f legacy/labs/TrendingSearches/naver/naver_shopping_sample.json ]; then
            if jq -e '.items | length > 0' legacy/labs/TrendingSearches/naver/naver_shopping_sample.json >/dev/null 2>&1; then
              jq -r '.items[]? | "\(.ranking). \(.keyword)"' legacy/labs/TrendingSearches/naver/naver_shopping_sample.json 2>/dev/null | head -10 | while read -r line; do
                echo "$line" >> $GITHUB_STEP_SUMMARY
                echo "$line"
              done
            else
              echo "⚠️ API에서 트렌드 데이터가 없습니다. Secrets(NAVER_CLIENT_ID/SECRET) 및 네이버 데이터랩 API 설정을 확인하세요." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No data" >> $GITHUB_STEP_SUMMARY
          fi
