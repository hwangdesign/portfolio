# 일일 네이버 쇼핑 인기 키워드 수집 (API) → main에 커밋
name: Daily Shopping Keywords Collection

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'labs/TrendingSearches/**'
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 = KST 오전 7:00
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/TrendingSearches

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Naver Shopping API (순위 키워드 매칭)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node naver-shopping-api.js
        continue-on-error: true

      - name: Copy latest to sample (for viewer)
        run: |
          LATEST_NAVER=$(ls -t naver/naver_shopping_*.json 2>/dev/null | grep -v sample | head -1)
          [ -n "$LATEST_NAVER" ] && cp "$LATEST_NAVER" naver/naver_shopping_sample.json || true

      - name: Commit and push keyword data
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add naver/*.json
          git diff --staged --quiet || git commit -m "chore(shopping-keywords): 네이버 쇼핑 인기 키워드 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M')"
          git push
